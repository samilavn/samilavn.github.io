<style>
:root{

  --r:14px; --shadow:0 1px 2px rgba(29,42,27,.06),0 4px 14px rgba(29,42,27,.05);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Be Vietnam Pro",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}

<body>
<div id="demo" class="demo hidden">Bản xem thử, đơn đặt ở đây không gửi tới Tiệm.</div>
<img class="hero" src="banner.jpg" alt="Sâmila – Nước sâm từ thảo mộc thiên nhiên" width="1118" height="308">
<main class="wrap">
  <div id="status" class="status" role="status">Đang tải thực đơn…</div>

  <nav class="tabs" role="tablist" aria-label="Mục">
    <button role="tab" data-tab="menu" aria-selected="true">Thực đơn</button>
    <button role="tab" data-tab="orders" aria-selected="false">Đơn của tôi</button>

  </nav>

<script>
'use strict';
/* ================= Tiện ích ================= */
const $ = id => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
}
const setKids = (el, ...k) => { el.replaceChildren(...k.flat(9).filter(x => x != null && x !== false)); return el; };
const money = n => Math.round(n).toLocaleString('vi-VN').replace(/,/g, '.') + 'đ';
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const API = (window.SAMILA_API || '').trim();
const DEMO = !API;
const CID = store.get('samila.cid', null) || (() => { const id = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)); store.set('samila.cid', id); return id; })();
const ERR = {
  BAD_PHONE: 'Số điện thoại chưa đúng (10 số, bắt đầu bằng 0).',
  NEED_APT: 'Bạn nhập số căn hộ giúp Tiệm.', NEED_ADDR: 'Bạn nhập địa chỉ giao hàng giúp Tiệm.', NEED_NAME: 'Bạn nhập tên giúp Tiệm.',
  BAD_TIME: 'Giờ giao này không còn hợp lệ, bạn chọn lại giúp Tiệm.', PAUSED: 'Tiệm đang tạm ngưng nhận đơn.',
  TOO_MANY: 'Bạn đặt nhiều đơn quá, đợi một lát rồi thử lại nhé.', GONE: 'Có món vừa hết hàng. Thực đơn đã được tải lại.',
  PRICE_CHANGED: 'Giá vừa thay đổi. Bạn xem lại tổng tiền rồi đặt lại nhé.', EMPTY: 'Giỏ hàng đang trống.',
  TOO_LATE: 'Đã quá thời gian được huỷ. Bạn nhắn Tiệm qua Zalo nếu cần đổi đơn.', LOCKED: 'Tiệm đã xử lý đơn này nên không huỷ được nữa.',
  NOT_FOUND: 'Không tìm thấy đơn.', NET: 'Không kết nối được. Kiểm tra mạng rồi thử lại.', SERVER: 'Hệ thống đang bận, bạn thử lại sau ít phút.',
  NOT_DONE: 'Đơn này chưa giao xong nên chưa gửi được mục này.', TOO_LATE_FB: 'Đã quá thời hạn gửi mục này. Bạn nhắn Tiệm qua Zalo nếu cần.',
  ALREADY: 'Bạn đã đánh giá đơn này rồi.', DUP: 'Bạn đã báo lỗi này rồi, Tiệm đang xem xét.',
  LIMIT: 'Đơn này đã đủ số lần báo lỗi tối đa. Bạn nhắn Tiệm qua Zalo nếu cần thêm.',
  BAD_STARS: 'Bạn chọn số sao giúp Tiệm.', BAD_KIND: 'Bạn chọn loại lỗi giúp Tiệm.', BAD_WANT: 'Bạn chọn cách Tiệm xử lý giúp.', BAD_ITEM: 'Bạn chọn món bị lỗi giúp Tiệm.'
};
const errText = r => ERR[r && r.error] || ERR.SERVER;

async function call(body) {
  if (DEMO) return Demo.call(body);
  try {
    const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
    return await res.json();
  } catch (e) { return { ok: false, error: 'NET' }; }
}

/* ================= Tính tiền (giống script) ================= */
const sizeKey = n => (/330ml/.test(n) ? 't330' : /500ml/.test(n) ? 't500' : null);
function calc(products, tiers, cart) {
  const sold = {}, lines = [];
  for (const p of products) { const k = sizeKey(p.name); if (k && cart[p.name]) sold[k] = (sold[k] || 0) + cart[p.name]; }
  let gross = 0, discount = 0, count = 0;
  for (const p of products) {
    const q = cart[p.name] || 0;
    if (!q) continue;
    const k = sizeKey(p.name);
    let unit = p.price;
    if (k) {
      let tier = null;
      for (const t of tiers) if (t.qty <= sold[k] && (!tier || t.qty > tier.qty)) tier = t;
      if (tier && typeof tier[k] === 'number') unit = tier[k] / tier.qty;
    }
    const d = Math.max(0, (p.price - unit) * q);
    lines.push({ name: p.name, qty: q, price: p.price, discount: d, amount: p.price * q - d });
    gross += p.price * q; discount += d; count += q;
  }
  return { lines, gross, discount: Math.round(discount), total: Math.round(gross - discount), count };
}
function parseName(n) {
  const parts = n.split('/').map(s => s.trim());
  return { flavor: parts[0] || n, pack: parts.length > 2 ? parts[1] : '', size: parts[parts.length - 1] || '' };
}
const shortName = n => { const p = parseName(n); return p.flavor + ' ' + p.size; };

/* ================= Giờ giao (giờ Việt Nam) ================= */
const OFF = 7 * 3600e3;
const vn = ms => { const d = new Date(ms + OFF); return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate(), min: d.getUTCHours() * 60 + d.getUTCMinutes(), wd: d.getUTCDay() }; };
const vnMs = (y, m, d, min) => Date.UTC(y, m, d, 0, min) - OFF;
const hm = min => String(Math.floor(min / 60)).padStart(2, '0') + ':' + String(min % 60).padStart(2, '0');
const now = () => Date.now() + (S.skew || 0);
function dayShifts(ms, k) { const v = vn(ms); return S.menu.shifts.map(s => [vnMs(v.y, v.m, v.d + k, s[0]), vnMs(v.y, v.m, v.d + k, s[1])]); }
function earliest(t) {
  for (let k = 0; k <= S.menu.daysAhead; k++) for (const s of dayShifts(t, k)) {
    if (t < s[0]) return s[0] + S.menu.prep * 60000;
    if (t < s[1]) return Math.ceil((t + S.menu.prep * 60000) / 60000) * 60000;
  }
  return null;
}
function isOpen(t) { return dayShifts(t, 0).some(s => t >= s[0] && t < s[1]); }
function dayLabel(ms) {
  const v = vn(ms), today = vn(now());
  const diff = Math.round((Date.UTC(v.y, v.m, v.d) - Date.UTC(today.y, today.m, today.d)) / 864e5);
  if (diff === 0) return 'Hôm nay';
  if (diff === 1) return 'Ngày mai';
  return ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'][v.wd] + ' ' + String(v.d).padStart(2, '0') + '/' + String(v.m + 1).padStart(2, '0');
}
const when = ms => hm(vn(ms).min) + ' ' + dayLabel(ms).toLowerCase();
// Các ngày và khung 15 phút khách được chọn.
function slotDays() {
  const t = now(), first = earliest(t), out = [];
  if (first == null) return out;
  for (let k = 0; k <= S.menu.daysAhead; k++) {
    const slots = [];
    for (const s of dayShifts(t, k)) {
      const a = s[0] + S.menu.prep * 60000, b = s[1] + S.menu.prep * 60000;
      for (let x = Math.ceil(Math.max(a, first) / 900000) * 900000; x <= b; x += 900000) slots.push(x);
    }
    if (slots.length) out.push({ day: dayShifts(t, k)[0][0], slots });
  }
  return out;
}

/* ================= VietQR ================= */
function crc16(s) {
  let c = 0xFFFF;
  for (let i = 0; i < s.length; i++) {
    c ^= s.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++) c = c & 0x8000 ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF;
  }
  return c.toString(16).toUpperCase().padStart(4, '0');
}
const tlv = (id, v) => id + String(v.length).padStart(2, '0') + v;
function vietqr(bin, acct, amount, content) {
  const acc = tlv('00', 'A000000727') + tlv('01', tlv('00', bin) + tlv('01', acct)) + tlv('02', 'QRIBFTTA');
  let p = tlv('00', '01') + tlv('01', '12') + tlv('38', acc) + tlv('53', '704') + tlv('54', String(Math.round(amount))) + tlv('58', 'VN') + tlv('62', tlv('08', content)) + '6304';
  return p + crc16(p);
}
function qrSvg(text) {
  if (typeof qrcode !== 'function') return null;
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  const box = h('div', { class: 'box', html: q.createSvgTag({ cellSize: 5, margin: 2, scalable: true }) });
  return box;
}

/* ================= Trạng thái ================= */
const S = {
  menu: null, skew: 0, cart: store.get('samila.cart', {}), tab: 'menu', view: 'menu',
  profile: store.get('samila.profile', {}), member: store.get('samila.member', null),
  orders: store.get('samila.orders', []),            // [{code, token, at}] đơn đặt từ máy này
  co: { area: null, asap: true, day: 0, slot: null, pay: null }, busy: false, order: null, tick: null, poll: null
};
function saveCart() { store.set('samila.cart', S.cart); }

function show(view) {
  S.view = view;
  for (const v of ['menu', 'checkout', 'order', 'orders', 'member']) $('v-' + v).classList.toggle('hidden', v !== view);
  const tab = view === 'checkout' ? 'menu' : view === 'order' ? 'orders' : view;
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  renderBar();
  if (view !== 'order') stopTimers();
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => {
  const t = b.dataset.tab;
  if (t === 'menu') { renderMenu(); show('menu'); }
  if (t === 'orders') { renderOrders(); show('orders'); }
  if (t === 'member') { renderMember(); show('member'); }
}));

async function loadMenu() {
  const r = await call({ action: 'menu' });
  if (!r.ok) { $('status').className = 'status stop'; $('status').textContent = errText(r) + ' Kéo xuống để tải lại trang.'; return false; }
  S.menu = r; S.skew = r.now - Date.now();
  // Bỏ món đã ngưng bán khỏi giỏ.
  const names = r.products.map(p => p.name);
  for (const n of Object.keys(S.cart)) if (!names.includes(n) || !(S.cart[n] > 0)) delete S.cart[n];
  saveCart();
  renderStatus();
  return true;
}
function renderStatus() {
  const m = S.menu, st = $('status');
  const t = now(), first = earliest(t);
  if (m.paused) { st.className = 'status stop'; st.textContent = 'Tiệm đang tạm ngưng nhận đơn. Bạn quay lại sau nhé.'; }
  else if (isOpen(t)) {
    const end = dayShifts(t, 0).find(s => t >= s[0] && t < s[1])[1];
    st.className = 'status'; st.textContent = 'Đang nhận đơn đến ' + hm(vn(end).min) + '. Giao sớm nhất ' + when(first) + '.';
  } else if (first) { st.className = 'status off'; st.textContent = 'Ngoài giờ nhận đơn. Bạn vẫn đặt trước được, giao sớm nhất ' + when(first) + '.'; }
  else { st.className = 'status stop'; st.textContent = 'Tiệm chưa mở nhận đơn.'; }
  $('notice').textContent = m.notice || '';
  $('notice').classList.toggle('hidden', !m.notice);
  document.title = m.shop + ' – Nước sâm thảo mộc';
}

/* ================= Thực đơn ================= */
function renderMenu() {
  const m = S.menu, root = $('v-menu');
  setKids(root);
  if (!m) return;
  if (!m.products.length) { root.append(h('p', { class: 'empty' }, 'Hôm nay Tiệm chưa có món nào. Bạn quay lại sau nhé.')); return; }
  const rt = m.rating;
  if (rt && rt.count >= 3) {      // đủ 3 đánh giá mới hiện điểm trung bình
    root.append(h('div', { class: 'card sumbox' }, h('b', {}, '★ ' + rt.avg.toFixed(1).replace('.', ',')), h('span', { class: 'small' }, rt.count + ' khách đã đánh giá'),
      (rt.recent || []).slice(0, 2).map(x => h('div', { class: 'q' }, '“' + x.note + '”'))));
  }
  const groups = new Map();
  for (const p of m.products) {
    const n = parseName(p.name), key = n.flavor + '|' + n.pack;
    if (!groups.has(key)) groups.set(key, { flavor: n.flavor, pack: n.pack, items: [] });
    groups.get(key).items.push({ p, size: n.size });
  }
  const c = calc(m.products, m.tiers, S.cart);
  const unitOf = name => { const l = c.lines.find(x => x.name === name); return l ? l.amount / l.qty : null; };
  root.append(h('h2', {}, 'Thực đơn'));
  for (const g of groups.values()) {
    const card = h('article', { class: 'card flavor' }, h('h3', {}, g.flavor), g.pack ? h('div', { class: 'sub' }, 'Đóng ' + g.pack) : null);
    for (const { p, size } of g.items) {
      const q = S.cart[p.name] || 0, u = unitOf(p.name);
      const priceTxt = u != null && Math.round(u) < p.price ? [h('s', { class: 'small' }, money(p.price)), ' ', money(u) + '/chai'] : [money(p.price)];
      card.append(h('div', { class: 'size' },
        h('div', { class: 'lbl' }, h('b', {}, size), h('span', {}, ...priceTxt)),
        h('div', { class: 'step' + (q ? ' on' : ''), role: 'group', 'aria-label': g.flavor + ' ' + size },
          h('button', { type: 'button', 'aria-label': 'Bớt 1', disabled: !q, onclick: () => setQty(p.name, q - 1) }, '−'),
          h('output', { 'aria-live': 'polite' }, q),
          h('button', { type: 'button', 'aria-label': 'Thêm 1', disabled: q >= 50, onclick: () => setQty(p.name, q + 1) }, '+'))));
    }
    root.append(card);
  }
  const tiers = m.tiers.filter(t => t.qty >= 2).sort((a, b) => a.qty - b.qty);
  if (tiers.length) {
    root.append(h('div', { class: 'card' },
      h('h3', {}, 'Mua càng nhiều, giá càng mềm'),
      h('p', { class: 'small', style: 'margin:4px 0 0' }, 'Tính chung mọi vị cùng cỡ chai trong một đơn. Giá mỗi chai:'),
      h('table', { class: 'tiers' },
        h('thead', {}, h('tr', {}, h('th', {}, 'Số chai'), h('th', {}, '330ml'), h('th', {}, '500ml'))),
        h('tbody', {}, ...[{ qty: 1, t330: base('t330'), t500: base('t500') }].concat(tiers).map(t => h('tr', {},
          h('td', {}, t.qty === tiers[tiers.length - 1].qty ? t.qty + ' trở lên' : t.qty),
          h('td', {}, t.t330 ? money(t.t330 / t.qty) : '–'), h('td', {}, t.t500 ? money(t.t500 / t.qty) : '–')))))));
  }
  function base(k) { const p = m.products.find(x => sizeKey(x.name) === k); return p ? p.price : null; }
  renderBar();
}
function setQty(name, q) {
  q = Math.max(0, Math.min(50, q));
  if (q) S.cart[name] = q; else delete S.cart[name];
  saveCart(); renderMenu();
}
function renderBar() {
  const show = S.menu && (S.view === 'menu') && Object.keys(S.cart).length > 0;
  $('bar').classList.toggle('hidden', !show);
  if (!show) return;
  const c = calc(S.menu.products, S.menu.tiers, S.cart);
  setKids($('barSum'), h('div', { class: 'small' }, c.count + ' chai'), h('b', {}, money(c.total)), c.discount ? h('s', {}, money(c.gross)) : '');
  $('barBtn').disabled = S.menu.paused;
}
$('barBtn').addEventListener('click', () => { renderCheckout(); show('checkout'); });

  S.keep = keep;

async function place(f, c, ship) {
  const err = $('coErr'), co = S.co;
  S.keep();
  const pf = S.profile;
  const phone = (pf.phone || '').replace(/[^\d+]/g, '').replace(/^\+84/, '0');
  let msg = '';
  if (!/^0\d{9}$/.test(phone)) msg = ERR.BAD_PHONE;
  else if (!co.area) msg = 'Bạn chọn nơi giao giúp Tiệm.';
  else if (co.area === 'cc' && !(pf.apt || '').trim()) msg = ERR.NEED_APT;
  else if (co.area === 'out' && !(pf.addr || '').trim()) msg = ERR.NEED_ADDR;
  else if (!co.asap && !co.slot) msg = 'Bạn chọn giờ giao giúp Tiệm.';
  else if (!co.pay) msg = 'Bạn chọn cách thanh toán giúp Tiệm.';
  if (msg) { err.textContent = msg; err.scrollIntoView({ block: 'center' }); return; }
  pf.area = co.area; store.set('samila.profile', pf);
  S.busy = true; $('placeBtn').disabled = true; $('placeBtn').textContent = 'Đang gửi đơn…';
  const r = await call({
    action: 'order', cid: CID, hp: f.hp.value, phone, name: pf.name || '', area: co.area, apt: pf.apt || '', addr: pf.addr || '',
    when: co.asap ? null : co.slot, pay: co.pay, note: co.note || '',
    items: c.lines.map(l => ({ name: l.name, qty: l.qty })), clientTotal: c.total + ship
  });
  S.busy = false;
  if (!r.ok) {
    if (['GONE', 'PRICE_CHANGED', 'BAD_TIME'].includes(r.error)) await loadMenu();
    renderCheckout(errText(r));
    return;
  }
  S.orders = [{ code: r.order.code, token: r.token, at: r.order.at }].concat(S.orders.filter(o => o.code !== r.order.code)).slice(0, 30);
  store.set('samila.orders', S.orders);
  S.cart = {}; saveCart(); S.co.note = '';
  openOrder(r.order, r.token, true);
}

/* ================= Màn hình đơn ================= */
const FINAL = ['Đã giao', 'Từ chối', 'Huỷ'];
function badgeClass(st) { return st === 'Huỷ' || st === 'Từ chối' ? 'badge bad' : st === 'Mới' ? 'badge wait' : 'badge'; }
function statusText(st) { return st === 'Mới' ? 'Chờ Tiệm xác nhận' : st; }
function stopTimers() { clearInterval(S.tick); clearInterval(S.poll); S.tick = S.poll = null; }

function openOrder(o, token, fresh) {
  S.order = { o, token, fresh };
  S.fb = { rate: { stars: 0, tags: [], note: '' }, rep: { open: false, item: '', kind: '', want: '', note: '' } };   // bản nháp đánh giá / báo lỗi
  renderOrder();
  show('order');
  stopTimers();
  S.tick = setInterval(tickTimer, 1000);
  if (!FINAL.includes(o.status)) S.poll = setInterval(refreshOrder, 20000);
}
async function refreshOrder() {
  if (!S.order || S.view !== 'order') return;
  const r = await call({ action: 'view', code: S.order.o.code, token: S.order.token });
  if (r.ok) { S.order.o = r.order; renderOrder(); if (FINAL.includes(r.order.status)) clearInterval(S.poll); }
}
function tickTimer() {
  const el = $('cdClock');
  if (!el || !S.order) return;
  const left = S.order.o.cancelUntil - now();
  if (left <= 0 || S.order.o.status !== 'Mới') { renderOrder(); clearInterval(S.tick); return; }
  el.textContent = Math.floor(left / 60000) + ':' + String(Math.floor(left / 1000) % 60).padStart(2, '0');
}

function copy(text, btn) {
  const done = () => { const t = btn.textContent; btn.textContent = 'Đã chép'; setTimeout(() => { btn.textContent = t; }, 1500); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => prompt('Chép mã này:', text));
  else prompt('Chép mã này:', text);
}

/* ================= Đơn của tôi ================= */

  root.append(list);
  const results = await Promise.all(S.orders.slice(0, 10).map(o => call({ action: 'view', code: o.code, token: o.token }).then(r => ({ r, o }))));
  setKids(list, ...results.filter(x => x.r.ok).map(({ r, o }) => h('button', { type: 'button', onclick: () => openOrder(r.order, o.token, false) },
    h('div', { class: 'top' }, h('b', {}, r.order.code), h('span', { class: badgeClass(r.order.status) }, statusText(r.order.status))),
    h('div', { class: 'it' }, r.order.lines.map(l => l.qty + ' × ' + shortName(l.name)).join('\n')),
    h('div', { class: 'top', style: 'margin-top:6px' }, h('span', { class: 'small' }, 'Giao ' + when(r.order.deliverAt)), h('b', {}, money(r.order.total))))));

/* ================= Thành viên ================= */
async function renderMember(note) {
  const root = $('v-member'), mb = S.member;
  setKids(root, h('h2', {}, 'Thành viên Sâmila'));
  if (note) root.append(h('div', { class: 'msg ' + (note.ok ? 'ok' : 'bad'), role: 'alert' }, note.text));
  if (mb && mb.token) {
    const r = await call({ action: 'me', phone: mb.phone, token: mb.token });
    if (r.ok) return memberCard(root, r);
    if (r.error === 'NOT_FOUND') { S.member = null; store.set('samila.member', null); }
  }
  joinForm(root);
}
function memberCard(root, r) {
  const m = r.member;
  S.profile = Object.assign(S.profile, { phone: m.phone, name: m.name, area: m.area, [m.area === 'out' ? 'addr' : 'apt']: m.place });
  store.set('samila.profile', S.profile);
  if (m.status !== 'Thành viên') {
    root.append(h('div', { class: 'card zalo' },
      h('h3', {}, 'Còn một bước: xác nhận qua Zalo'),
      h('ol', { class: 'steps' }, h('li', {}, 'Chép mã ', h('b', {}, m.code)), h('li', {}, 'Mở Zalo Sâmila'), h('li', {}, 'Gửi mã cho Tiệm')),
      h('div', { class: 'inline' },
        h('button', { class: 'btn ghost', type: 'button', onclick: e => copy(m.code, e.target) }, 'Chép mã'),
        r.zaloLink ? h('a', { class: 'btn', href: r.zaloLink, target: '_blank', rel: 'noopener', style: 'text-decoration:none' }, 'Mở Zalo Sâmila') : null),
      h('button', { class: 'back', type: 'button', onclick: () => renderMember() }, 'Tôi đã gửi mã, kiểm tra lại')));
  }
  root.append(h('div', { class: 'card' },
    h('h3', {}, m.name),
    h('p', { class: 'small', style: 'margin:2px 0 8px' }, m.status === 'Thành viên' ? 'Thành viên đã xác nhận qua Zalo' : 'Chờ xác nhận qua Zalo'),
    h('dl', { class: 'kv' }, h('dt', {}, 'SĐT'), h('dd', {}, m.phone), h('dt', {}, 'Giao tới'), h('dd', {}, m.area === 'out' ? m.place : (S.menu ? S.menu.building : 'Chung cư') + ', căn ' + m.place)),
    h('p', { class: 'small', style: 'margin:10px 0 0' }, 'Thông tin này tự điền khi bạn đặt hàng.'),
    h('button', { class: 'back', type: 'button', onclick: () => { S.member = null; store.set('samila.member', null); joinForm(setKids(root, h('h2', {}, 'Sửa thông tin')) || root, m); } }, 'Sửa thông tin')));
  if (r.orders.length) {
    root.append(h('h2', {}, 'Đơn gần đây'), h('div', { class: 'olist' }, r.orders.map(o => h('button', { type: 'button', onclick: async () => {
      const v = await call({ action: 'view', code: o.code, token: o.token }); if (v.ok) openOrder(v.order, o.token, false);
    } }, h('div', { class: 'top' }, h('b', {}, o.code), h('span', { class: badgeClass(o.status) }, statusText(o.status))),
      h('div', { class: 'it' }, o.items), h('div', { class: 'top', style: 'margin-top:6px' }, h('span', { class: 'small' }, new Date(o.at).toLocaleDateString('vi-VN')), h('b', {}, money(o.total)))))));
  }
}
function joinForm(root, prev) {
  const pf = prev ? { phone: prev.phone, name: prev.name, area: prev.area, apt: prev.area === 'cc' ? prev.place : '', addr: prev.area === 'out' ? prev.place : '' } : S.profile;
  let area = pf.area || 'cc';
  const f = {};
  const form = h('div', { class: 'card' },
    h('h3', {}, 'Đăng ký thành viên'),
    h('p', { class: 'small', style: 'margin:4px 0 0' }, 'Đăng ký một lần, lần sau đặt hàng không cần nhập lại. Tiệm báo đơn cho bạn qua Zalo.'),
    h('label', { class: 'f', for: 'j-phone' }, 'Số điện thoại'),
    (f.phone = h('input', { class: 't', id: 'j-phone', type: 'tel', inputmode: 'tel', autocomplete: 'tel', value: pf.phone || '' })),
    h('label', { class: 'f', for: 'j-name' }, 'Tên'),
    (f.name = h('input', { class: 't', id: 'j-name', autocomplete: 'name', maxlength: 50, value: pf.name || '' })),
    h('div', { class: 'f' }, 'Thường giao tới'),
    (f.areaBox = h('div', { class: 'choices' })),
    (f.placeBox = h('div', {})),
    h('div', { class: 'hp', 'aria-hidden': 'true' }, (f.hp = h('input', { tabindex: '-1', autocomplete: 'off' }))),
    (f.err = h('div', { class: 'err', role: 'alert' })),
    (f.btn = h('button', { class: 'btn block', style: 'margin-top:14px', type: 'button', onclick: submit }, 'Đăng ký')));
  function drawArea() {
    setKids(f.areaBox, 
      h('button', { type: 'button', 'aria-pressed': String(area === 'cc'), onclick: () => { area = 'cc'; drawArea(); } }, (S.menu && S.menu.building) || 'Chung cư'),
      h('button', { type: 'button', 'aria-pressed': String(area === 'out'), onclick: () => { area = 'out'; drawArea(); } }, 'Bên ngoài'));
    f.place = area === 'cc' ? h('input', { class: 't', id: 'j-place', maxlength: 20, placeholder: 'Số căn hộ, ví dụ A0605', value: pf.apt || '' })
      : h('textarea', { class: 't', id: 'j-place', maxlength: 200, placeholder: 'Số nhà, đường, phường' });
    if (area === 'out') f.place.value = pf.addr || '';
    setKids(f.placeBox, h('label', { class: 'f', for: 'j-place' }, area === 'cc' ? 'Số căn hộ' : 'Địa chỉ'), f.place);
  }
  drawArea();
  root.append(form);
  async function submit() {
    const phone = f.phone.value.replace(/[^\d+]/g, '').replace(/^\+84/, '0');
    if (!/^0\d{9}$/.test(phone)) { f.err.textContent = ERR.BAD_PHONE; return; }
    if (!f.name.value.trim()) { f.err.textContent = ERR.NEED_NAME; return; }
    if (!f.place.value.trim()) { f.err.textContent = area === 'cc' ? ERR.NEED_APT : ERR.NEED_ADDR; return; }
    f.btn.disabled = true; f.btn.textContent = 'Đang gửi…';
    const r = await call({ action: 'join', cid: CID, hp: f.hp.value, phone, name: f.name.value.trim(), area, apt: area === 'cc' ? f.place.value : '', addr: area === 'out' ? f.place.value : '' });
    if (!r.ok) { f.btn.disabled = false; f.btn.textContent = 'Đăng ký'; f.err.textContent = errText(r); return; }
    S.member = { phone, token: r.token }; store.set('samila.member', S.member);
    renderMember();
  }
}

/* ================= Chế độ xem thử ================= */
const Demo = {
  db: { orders: {}, member: null, fb: {} },
  menu() {
    return { ok: true, now: Date.now(), shop: 'Sâmila',
      products: [{ name: 'Sâm hoa cúc / chai / 330ml', price: 19000 }, { name: 'Sâm hoa cúc / chai / 500ml', price: 28000 },
        { name: 'Sâm mía lau bịch / chai / 330ml', price: 19000 }, { name: 'Sâm mía lau bịch / chai / 500ml', price: 28000 }],
      tiers: [{ qty: 1, t330: 19000, t500: 28000 }, { qty: 2, t330: 36000, t500: 52000 }, { qty: 3, t330: 52000, t500: 75000 }, { qty: 4, t330: 68000, t500: 98000 }, { qty: 5, t330: 82000, t500: 119000 }],
      shifts: [[600, 840], [1080, 1260]], prep: 30, cancelMin: 5, daysAhead: 7, building: 'Chung cư Mỹ Phúc',
      ship: { cc: 0, out: 0 }, paused: false, notice: '', zalo: 'https://zalo.me/3712879380799354133',
      fb: { good: ['Vị ngon', 'Đúng giờ', 'Đóng gói đẹp', 'Giá hợp lý', 'Giao thân thiện'], bad: ['Vị chưa hợp', 'Giao trễ', 'Đóng gói chưa tốt', 'Giá hơi cao', 'Món không đúng ý'],
        kinds: ['Thiếu hàng', 'Sai món', 'Chai hỏng / rò', 'Vị lạ, nghi hỏng', 'Giao trễ', 'Khác'], wants: ['Đổi món', 'Hoàn tiền', 'Chỉ báo để Tiệm biết'], reportDays: 3 },
      rating: { count: 23, avg: 4.8, recent: [{ stars: 5, note: 'Uống mát, vị thanh, giao nhanh' }, { stars: 5, note: 'Sâm mía lau rất thơm' }] } };
  },
  // Xem thử: thêm ?xem=giao vào địa chỉ để đơn đặt thử hiện sẵn trạng thái Đã giao (thử đánh giá, báo lỗi).
  fbOf(o) {
    if (o.status !== 'Đã giao') return { rating: null, reports: [], canRate: false, canReport: false };
    const f = this.db.fb[o.code] || (this.db.fb[o.code] = { rating: null, reports: [] });
    return { rating: f.rating, reports: f.reports.slice(), canRate: !f.rating, canReport: f.reports.length < 3 };
  },
  call(b) {
    return new Promise(res => setTimeout(() => res(this.handle(b)), 250));
  },
  handle(b) {
    const db = this.db, m = this.menu();
    if (b.action === 'menu') return m;
    if (b.action === 'order') {
      const c = calc(m.products, m.tiers, Object.fromEntries(b.items.map(i => [i.name, i.qty])));
      const code = 'SML' + String(Math.floor(10000 + Math.random() * 89999)), t = Date.now();
      const o = { code, at: t, status: new URLSearchParams(location.search).get('xem') === 'giao' ? 'Đã giao' : 'Mới', phone: b.phone, name: b.name, area: b.area === 'cc' ? m.building : 'Bên ngoài', place: b.area === 'cc' ? b.apt.toUpperCase() : b.addr,
        deliverAt: b.when || earliest(t), asap: b.when == null, lines: c.lines, gross: c.gross, discount: c.discount, ship: 0, total: c.total,
        pay: b.pay, money: b.pay === 'bank' ? 'Chưa thanh toán' : 'Trả khi nhận hàng', note: b.note, zalo: false, cancelUntil: t + 5 * 60000,
        bank: b.pay === 'bank' ? { bin: '970416', bankName: 'ACB', acct: '822258', owner: 'LO TAN KHANH' } : null, zaloLink: m.zalo };
      db.orders[code] = o;
      return { ok: true, order: Object.assign({}, o, { fb: this.fbOf(o) }), token: 'demo' };
    }
    const o = db.orders[b.code];
    if (b.action === 'view') return o ? { ok: true, order: Object.assign({}, o, { fb: this.fbOf(o) }) } : { ok: false, error: 'NOT_FOUND' };
    if (b.action === 'rate' || b.action === 'report') {
      if (!o || o.status !== 'Đã giao') return { ok: false, error: o ? 'NOT_DONE' : 'NOT_FOUND' };
      const f = this.fbOf(o), st = db.fb[o.code];
      if (b.action === 'rate') {
        if (f.rating) return { ok: false, error: 'ALREADY' };
        if (!(b.stars >= 1 && b.stars <= 5)) return { ok: false, error: 'BAD_STARS' };
        st.rating = { stars: b.stars, tags: b.tags || [], note: b.note || '' };
      } else {
        if (f.reports.length >= 3) return { ok: false, error: 'LIMIT' };
        st.reports.push({ id: 'LOI' + Math.floor(10000 + Math.random() * 89999), item: b.item, kind: b.kind, want: b.want, note: b.note || '', status: 'Mới', fix: '' });
      }
      return { ok: true, order: Object.assign({}, o, { fb: this.fbOf(o) }) };
    }
    if (b.action === 'cancel') { if (!o) return { ok: false, error: 'NOT_FOUND' }; if (Date.now() > o.cancelUntil) return { ok: false, error: 'TOO_LATE', order: o }; o.status = 'Huỷ'; return { ok: true, order: o }; }
    if (b.action === 'paid') { o.money = 'Đang xác nhận thanh toán'; return { ok: true, order: o }; }
    if (b.action === 'join') { db.member = { phone: b.phone, name: b.name, area: b.area, place: b.area === 'cc' ? b.apt.toUpperCase() : b.addr, status: 'Chờ xác nhận', code: 'TV' + String(Math.floor(100000 + Math.random() * 899999)) }; return { ok: true, token: 'demo', code: db.member.code }; }
    if (b.action === 'me') return db.member ? { ok: true, member: db.member, orders: [], zaloLink: m.zalo } : { ok: false, error: 'NOT_FOUND' };
    return { ok: false, error: 'SERVER' };
  }
};

/* ================= Khởi động ================= */
(async function start() {
  if (DEMO) { $('demo').classList.remove('hidden'); S.orders = []; S.member = null; }
  if (await loadMenu()) {
    renderMenu();
    const q = new URLSearchParams(location.search);
    if (q.get('don')) { const o = S.orders.find(x => x.code === q.get('don')); if (o) { const r = await call({ action: 'view', code: o.code, token: o.token }); if (r.ok) openOrder(r.order, o.token, false); } }
    setInterval(() => { if (S.view === 'menu') renderStatus(); }, 60000);
  }
})();
